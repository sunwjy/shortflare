name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"

jobs:
  package:
    name: Package candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Isolate Wrangler logs
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          const environmentFile = process.env.GITHUB_ENV;
          const runnerTemp = process.env.RUNNER_TEMP;
          if (!environmentFile || !runnerTemp) throw new Error("Runner paths are unavailable");
          fs.appendFileSync(
            environmentFile,
            `WRANGLER_LOG_PATH=${path.join(runnerTemp, "shortflare-wrangler-logs")}\n`,
          );

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the publishable package
        run: pnpm exec turbo run build --filter=./packages/deploy

      - name: Produce and verify the exact tarball
        run: pnpm --filter ./packages/deploy verify:packed-cli "${{ runner.temp }}/shortflare-packed-cli"

      - name: Upload the exact tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: shortflare-packed-cli
          path: |
            ${{ runner.temp }}/shortflare-packed-cli/*.tgz
            ${{ runner.temp }}/shortflare-packed-cli/*.sha256.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  platform:
    name: ${{ matrix.name }}
    needs: package
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Ubuntu
            os: ubuntu-24.04
          - name: macOS
            os: macos-15
          - name: Windows
            os: windows-2025
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 11.15.0
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.13.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Isolate Wrangler logs
        shell: node {0}
        run: |
          const fs = require("node:fs");
          const path = require("node:path");
          const environmentFile = process.env.GITHUB_ENV;
          const runnerTemp = process.env.RUNNER_TEMP;
          if (!environmentFile || !runnerTemp) throw new Error("Runner paths are unavailable");
          fs.appendFileSync(
            environmentFile,
            `WRANGLER_LOG_PATH=${path.join(runnerTemp, "shortflare-wrangler-logs")}\n`,
          );

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run deterministic repository checks
        run: pnpm check

      - name: Download the exact tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: shortflare-packed-cli
          path: ${{ runner.temp }}/shortflare-packed-cli

      - name: Install and smoke the packed CLI
        run: pnpm --filter ./packages/deploy smoke:packed-cli "${{ runner.temp }}/shortflare-packed-cli"

  required:
    name: CI / Required
    if: ${{ always() }}
    needs:
      - package
      - platform
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Require every CI job
        env:
          PACKAGE_RESULT: ${{ needs.package.result }}
          PLATFORM_RESULT: ${{ needs.platform.result }}
        run: |
          test "$PACKAGE_RESULT" = "success"
          test "$PLATFORM_RESULT" = "success"
